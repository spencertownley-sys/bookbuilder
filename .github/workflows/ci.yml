name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Placeholder keys: enough to compile; nothing is called at build time.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_placeholder

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    # Runs when the repo has Clerk *development* keys as secrets (Settings → Secrets → Actions):
    # E2E_CLERK_PUBLISHABLE_KEY and E2E_CLERK_SECRET_KEY. Never use production keys here.
    env:
      HAS_KEYS: ${{ secrets.E2E_CLERK_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEYS == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_KEYS == 'true'
      - run: npx playwright install --with-deps chromium
        if: env.HAS_KEYS == 'true'
      - name: Write .env.local
        if: env.HAS_KEYS == 'true'
        run: |
          cp .env.example .env.local
          sed -i "s#^NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=.*#NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}#" .env.local
          sed -i "s#^CLERK_SECRET_KEY=.*#CLERK_SECRET_KEY=${{ secrets.E2E_CLERK_SECRET_KEY }}#" .env.local
          echo "ADMIN_EMAILS=bb-e2e-admin+clerk_test@example.com" >> .env.local
      - run: npm run test:e2e
        if: env.HAS_KEYS == 'true'
      - uses: actions/upload-artifact@v4
        if: failure() && env.HAS_KEYS == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Skipped
        if: env.HAS_KEYS != 'true'
        run: echo "Add E2E_CLERK_PUBLISHABLE_KEY and E2E_CLERK_SECRET_KEY (Clerk development keys) to run end-to-end tests."
